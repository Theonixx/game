<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial scale=1.0">
        <title>Login | STI Adventures</title>
        <link rel="stylesheet" href="src/css/login-registerStyle.css">
    </head>

    <body>
        <div class = "container">
            <form id="loginForm">
                <div id="authMessage" class="auth-message" style="display:none;"></div>
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" id="loginUsername" name="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                </div>
                <input type="hidden" name="action" value="login">
                <div class ="btn-container">
                    <button type="reset" class="btn">Clear</button>
                    <button type="submit" class="btn">Login</button>
                </div>
                <div class ="input-box">
                    <p>Don't have an account yet? <a href="register.html">Register</a></p>
                </div>
                <div class="input-box" style="text-align:center; margin-top: 8px;">
                <button type="button" class="btn" id="guestBtn">Play as Guest</button>
            </div>
            </form>
        </div>

        <script src="src/js/auth.js"></script>
    </body>
</html>
