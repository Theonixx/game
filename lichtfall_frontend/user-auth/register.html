<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register | STI Adventures</title>
        <link rel="stylesheet" href="src/css/login-registerStyle.css">
    </head>

    <body>
        <div class="container">
            <form id="registerForm">
                <div id="authMessage" class="auth-message" style="display:none;"></div>
                <h1>Register</h1>
                <div class="input-box">
                    <input type="email" id="registerEmail" name="email" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="text" id="registerUsername" name="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" id="registerPassword" name="password" placeholder="Password" required>
                </div>
                <div class="btn-container">
                    <button type="reset" class="btn">Clear</button>
                    <button type="submit" class="btn">Create Account</button>
                </div>
                <div class="input-box">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </form>
        </div>
        
        <script src="src/js/auth.js"></script>
    </body>
</html>
